paths:
  l2a_archive: /path/to/L2A/tiles
  worldcover_2021: /path/to/WorldCover_2021.vrt
  tile_list: /path/to/tile_list.txt
  output: /path/to/output

selection:
  max_cloud_percent_exclusive: 20.0
  max_sun_zenith_deg_exclusive: 70.0
  near_nadir_deg_exclusive: 4.0
  valid_scl: [4, 5]
  landcover_classes: [10, 30, 40]
  max_pair_minutes: 30
  # Adjacent granules belonging to one platform's overpass may have different times.
  max_neighbor_sensing_minutes: 3

sampling:
  samples_per_class_per_tile: 200
  split_cropland_ndvi: true
  bare_ndvi_threshold: 0.1
  seed: 42
  window_pixels: 512

processing:
  geometry_band: B04
  workers: 1
  # Change this when the rasters referenced by a WorldCover VRT change.
  worldcover_revision: worldcover-2021-v200
